<!DOCTYPE html>
<!-- This sec namespace is required for Spring Security tags to work! -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>MovieTickets - Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .navbar { display: flex; justify-content: space-between; background: #333; padding: 15px; color: white; border-radius: 8px; margin-bottom: 20px; }
        .navbar a { color: white; text-decoration: none; padding: 8px 15px; background: #007bff; border-radius: 4px; margin-left: 10px; }
        .navbar a:hover { background: #0056b3; }
        .admin-btn { background: #dc3545 !important; }
        .logout-btn { background: #6c757d !important; }
        
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .movie-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .movie-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .movie-info { font-size: 14px; color: #666; margin-bottom: 5px; }
        .price { font-size: 18px; color: #28a745; font-weight: bold; margin: 15px 0; }
        
        .book-btn { display: inline-block; padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .book-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <h2>🎬 MovieTickets</h2>
        <div>
            
            <!-- Shows ONLY to Unauthenticated Guests -->
            <span sec:authorize="isAnonymous()">
                <a th:href="@{/login}">Login</a>
                <a th:href="@{/register}" style="background: #28a745;">Register</a>
            </span>

            <!-- Shows ONLY to users with the 'ADMIN' role -->
            <span sec:authorize="hasAuthority('ROLE_ADMIN')">
                <a th:href="@{/add-movie}" class="admin-btn">➕ Add Movie</a>
                <a th:href="@{/add-theatre}" class="admin-btn">➕ Add Theatre</a>
                <a th:href="@{/add-showtime}" class="admin-btn" style="background: #6f42c1 !important;">🎟️ Schedule</a>
            </span>
            
            <!-- Shows to ANYONE who is logged in -->
            <span sec:authorize="isAuthenticated()">
                <!-- ADD THIS NEW LINE -->
                <a th:href="@{/my-tickets}" style="background: #17a2b8; margin-right: 10px;">🎟️ My Tickets</a>
                
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="logout-btn" style="color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 16px;">Logout</button>
                </form>
            </span>
        </div>
    </div>

    <h3 style="text-align: center; color: #333;">Currently Showing</h3>

    <!-- The Movie Grid -->
    <div class="movie-grid">
        
        <!-- TH:EACH is a Thymeleaf loop. It repeats this card for every movie in the database -->
        <div class="movie-card" th:each="movie : ${movies}">
            <div class="movie-title" th:text="${movie.title}">Movie Title</div>
            <div class="movie-info" th:text="'Genre: ' + ${movie.genre}">Genre</div>
            <div class="movie-info" th:text="'Language: ' + ${movie.language}">Language</div>
            <div class="movie-info" th:text="${movie.durationInMinutes} + ' mins'">120 mins</div>
            
            <div class="price" th:text="'₹' + ${movie.ticketPrice}">₹250</div>
            
            <!-- Routes to the Theatre Selection page -->
            <a th:href="@{/theatres/{id}(id=${movie.id})}" class="book-btn">Select Theatre</a>
            
            <!-- Admin Delete Button -->
            <div sec:authorize="hasAuthority('ROLE_ADMIN')" style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc;">
                <form th:action="@{/delete-movie/{id}(id=${movie.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this movie?');">
                    <button type="submit" style="width: 100%; padding: 8px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">🗑️ Delete Movie</button>
                </form>
            </div>
            
        </div>

    </div>

    <!-- Shows if the database is currently empty -->
    <div th:if="${#lists.isEmpty(movies)}" style="text-align: center; margin-top: 50px; color: #777;">
        <h3>No movies available right now.</h3>
        <p>Click "➕ Add Movie" to populate the catalog!</p>
    </div>

</body>
</html>
