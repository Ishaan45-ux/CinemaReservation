<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Movie</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9;}
        .form-container { display: inline-block; padding: 30px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; text-align: left; width: 350px;}
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        button:hover { background-color: #0056b3; }
        .success-msg { color: green; font-weight: bold; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 style="text-align: center;">🎬 Add Movie</h2>
        
        <!-- Displays a success message if the URL has ?success at the end -->
        <div th:if="${param.success}" class="success-msg">
            Movie added successfully!
        </div>

        <form th:action="@{/add-movie}" th:object="${movie}" method="post">
            <div class="form-group">
                <label>Movie Title:</label>
                <input type="text" th:field="*{title}" required />
            </div>
            
            <div class="form-group">
                <label>Genre:</label>
                <input type="text" th:field="*{genre}" placeholder="e.g. Action, Comedy" required />
            </div>
            
            <div class="form-group">
                <label>Language:</label>
                <input type="text" th:field="*{language}" required />
            </div>
            
            <div class="form-group">
                <label>Duration (Minutes):</label>
                <input type="number" th:field="*{durationInMinutes}" required />
            </div>
            
            <div class="form-group">
                <label>Ticket Price (₹):</label>
                <input type="number" step="0.01" th:field="*{ticketPrice}" required />
            </div>

            <div class="form-group">
                <label>Description:</label>
                <textarea th:field="*{description}" rows="3"></textarea>
            </div>
            
            <button type="submit">Save Movie</button>
        </form>
        
        <div style="text-align: center; margin-top: 15px;">
            <a th:href="@{/}">Back to Home</a>
        </div>
    </div>

</body>
</html>
