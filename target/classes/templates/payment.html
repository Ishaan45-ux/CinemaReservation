<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Secure Payment</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .payment-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        .summary { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .pay-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .pay-btn:hover { background: #218838; }
        .timer { color: #dc3545; font-weight: bold; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="payment-box">
        <h2 style="margin-top: 0;">Secure Checkout</h2>
        
        <!-- A visual countdown timer (does not actually do the deleting, just urges the user) -->
        <div class="timer">Time remaining: <span id="countdown">10:00</span></div>

        <div class="summary">
            <p><strong>Movie:</strong> <span th:text="${ticket.showtime.movie.title}"></span></p>
            <p><strong>Seats:</strong> <span th:text="${ticket.seatNumbers}"></span></p>
            <h3 style="margin-bottom: 0; color: #28a745;">Total to Pay: ₹<span th:text="${ticket.totalAmount}"></span></h3>
        </div>

        <form th:action="@{/process-payment}" method="post">
            <input type="hidden" name="ticketId" th:value="${ticket.id}" />
            
            <label>Name on Card</label>
            <input type="text" placeholder="John Doe" required />
            
            <label>Card Number</label>
            <input type="text" placeholder="XXXX XXXX XXXX XXXX" required />
            
            <div class="row">
                <div style="flex: 1;">
                    <label>Expiry</label>
                    <input type="text" placeholder="MM/YY" required />
                </div>
                <div style="flex: 1;">
                    <label>CVV</label>
                    <input type="password" placeholder="XXX" required />
                </div>
            </div>
            
            <button type="submit" class="pay-btn">Pay Now</button>
        </form>
    </div>

    <!-- Simple JavaScript countdown visual -->
    <script>
        let time = 600; // 10 minutes in seconds
        setInterval(function() {
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;
            document.getElementById('countdown').innerText = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
            time--;
        }, 1000);
    </script>
</body>
</html>
