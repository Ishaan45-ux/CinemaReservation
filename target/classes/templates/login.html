<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Movie Booking</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9;}
        .form-container { display: inline-block; padding: 30px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; text-align: left; width: 300px; }
        div { margin-bottom: 15px; position: relative; }
        input { padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
        
        /* The warning messages */
        .error-msg { color: red; font-size: 14px; margin-bottom: 15px; text-align: center; }
        .success-msg { color: green; font-size: 14px; margin-bottom: 15px; text-align: center; }
        
        /* The hover eye icon */
        .eye-icon {
            position: absolute;
            right: 10px;
            top: 28px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 style="text-align: center;">Sign In</h2>
        
        <!-- Automatically shows error if the URL has ?error -->
        <div th:if="${param.error}" class="error-msg">
            Invalid Email or Password.
        </div>
        
        <!-- Automatically shows success if the URL has ?success (from registration) -->
        <div th:if="${param.success}" class="success-msg">
            Registration successful! Please log in.
        </div>
        
        <!-- Form sends data to /login, which Spring Security intercepts automatically -->
        <form th:action="@{/login}" method="post">
            <div>
                <label>Email Address:</label><br>
                <!-- Name MUST be "username" for Spring Security to recognize it, even though we type an email -->
                <input type="email" name="username" required />
            </div>
            
            <div>
                <label>Password:</label><br>
                <!-- Name MUST be "password" -->
                <input type="password" name="password" id="passwordField" required />
                
                <!-- The Hover Element -->
                <span class="eye-icon" id="eyeIcon">👁️</span>
            </div>
            
            <button type="submit">Login</button>
        </form>
        
        <div style="text-align: center; margin-top: 15px;">
            <a th:href="@{/register}">Need an account? Register</a>
        </div>
    </div>

    <!-- JavaScript for the hover effect -->
    <script>
        const passwordField = document.getElementById('passwordField');
        const eyeIcon = document.getElementById('eyeIcon');

        // When mouse enters the eye icon, change type to text
        eyeIcon.addEventListener('mouseenter', () => {
            passwordField.type = 'text';
        });

        // When mouse leaves the eye icon, change type back to password
        eyeIcon.addEventListener('mouseleave', () => {
            passwordField.type = 'password';
        });
    </script>

</body>
</html>
