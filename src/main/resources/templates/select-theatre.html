<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Theatre</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .header-box { background: #333; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        
        .showtime-grid { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 800px; margin: 0 auto; }
        .showtime-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        
        .theatre-info h3 { margin: 0 0 5px 0; color: #333; }
        .theatre-info p { margin: 0; color: #666; font-size: 14px; }
        
        .time-price { text-align: right; }
        .time { font-size: 18px; font-weight: bold; color: #007bff; display: block; margin-bottom: 5px; }
        .price { color: #28a745; font-weight: bold; }
        
        .seat-btn { display: inline-block; padding: 10px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .seat-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="header-box">
        <h2>Select Theatre & Showtime</h2>
        <!-- Dynamically inserts the movie title from the database -->
        <h3 style="color: #4da3ff;" th:text="${movie.title}">Movie Title</h3>
    </div>

    <div class="showtime-grid">
        
        <!-- Loops through every available showtime for this specific movie -->
        <div class="showtime-card" th:each="show : ${showtimes}">
            <div class="theatre-info">
                <h3 th:text="${show.theatre.name}">PVR Cinemas</h3>
                <p th:text="${show.theatre.address} + ', ' + ${show.theatre.city}">Address, City</p>
                <p th:text="'Date: ' + ${show.showDate}">Date</p>
            </div>
            
            <div class="time-price">
                <span class="time" th:text="${show.showTime}">19:00</span>
                <span class="price" th:text="'₹' + ${show.finalPrice}">₹300</span>
                <br>
                <!-- This will eventually route to our Seat Selection map! -->
                <a th:href="@{/seats/{id}(id=${show.id})}" class="seat-btn">Select Seats</a>
            </div>
        </div>

        <!-- Displays if the Admin hasn't scheduled this movie anywhere yet -->
        <div th:if="${#lists.isEmpty(showtimes)}" style="text-align: center; color: #777; padding: 40px; background: white; border-radius: 8px;">
            <h3>No showtimes available for this movie right now.</h3>
        </div>
        
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
        <a th:href="@{/}" style="color: #007bff; text-decoration: none; font-weight: bold;">⬅ Back to Movies</a>
    </div>

</body>
</html>
