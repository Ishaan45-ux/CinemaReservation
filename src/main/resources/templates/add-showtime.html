<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Schedule Showtime</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9;}
        .form-container { display: inline-block; padding: 30px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; text-align: left; width: 400px;}
        select, input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background-color: #6f42c1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>
    <div class="form-container">
        <h2 style="text-align: center;">🎟️ Schedule Showtime</h2>
        <div th:if="${param.success}" style="color: green; text-align: center; margin-bottom: 10px;">Showtime scheduled!</div>
        
        <form th:action="@{/add-showtime}" th:object="${showtime}" method="post">
            
            <label>Select Movie:</label>
            <select th:field="*{movie}" required>
                <option value="" disabled selected>-- Choose a Movie --</option>
                <option th:each="m : ${movies}" th:value="${m.id}" th:text="${m.title}"></option>
            </select>
            
            <label>Select Theatre:</label>
            <select th:field="*{theatre}" required>
                <option value="" disabled selected>-- Choose a Theatre --</option>
                <option th:each="t : ${theatres}" th:value="${t.id}" th:text="${t.name} + ' (' + ${t.city} + ')'"></option>
            </select>
            
            <label>Date:</label>
            <input type="date" th:field="*{showDate}" required />
            
            <label>Time:</label>
            <input type="time" th:field="*{showTime}" required />
            
            <label>Final Ticket Price (₹):</label>
            <input type="number" step="0.01" th:field="*{finalPrice}" placeholder="e.g. 350.00" required />
            
            <button type="submit">Schedule Showtime</button>
        </form>
        <div style="text-align: center; margin-top: 15px;"><a th:href="@{/}">Back to Home</a></div>
    </div>
</body>
</html>
