<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Movie Booking</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9;}
        .form-container { display: inline-block; padding: 30px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; }
        div { margin-bottom: 15px; }
        input { padding: 8px; width: 200px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Create an Account</h2>
        
        <!-- The form sends a POST request to /register -->
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div>
                <label>Full Name:</label><br>
                <input type="text" th:field="*{fullName}" required />
            </div>
            
            <div>
                <label>Email:</label><br>
                <input type="email" th:field="*{email}" required />
            </div>
            
            <div>
                <label>Password:</label><br>
                <input type="password" th:field="*{password}" required />
            </div>
            
            <button type="submit">Register</button>
        </form>
        <br>
        <a th:href="@{/login}">Already have an account? Login here</a>
    </div>

</body>
</html>
