<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Theatre</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9;}
        .form-container { display: inline-block; padding: 30px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; text-align: left; width: 350px;}
        input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>
    <div class="form-container">
        <h2 style="text-align: center;">🏢 Add Theatre</h2>
        <div th:if="${param.success}" style="color: green; text-align: center; margin-bottom: 10px;">Theatre saved!</div>
        
        <form th:action="@{/add-theatre}" th:object="${theatre}" method="post">
            <label>Theatre Name:</label>
            <input type="text" th:field="*{name}" placeholder="e.g. PVR Cinemas" required />
            
            <label>City:</label>
            <input type="text" th:field="*{city}" value="Bhopal" required />
            
            <label>Address:</label>
            <input type="text" th:field="*{address}" required />
            
            <button type="submit">Save Theatre</button>
        </form>
        <div style="text-align: center; margin-top: 15px;"><a th:href="@{/}">Back to Home</a></div>
    </div>
</body>
</html>
