<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Seats</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #222; color: white; text-align: center; padding: 20px;}
        .screen { background: #fff; height: 10px; width: 60%; margin: 20px auto; box-shadow: 0 10px 20px rgba(255,255,255,0.5); border-radius: 5px; }
        .screen-text { color: #888; font-size: 14px; margin-bottom: 40px; letter-spacing: 5px; text-transform: uppercase; }
        
        .seat-map { display: inline-block; background: #333; padding: 30px; border-radius: 10px; }
        .row { display: flex; justify-content: center; margin-bottom: 10px; align-items: center; }
        .row-label { width: 30px; font-weight: bold; color: #aaa; }
        
        /* Hiding the actual checkbox box */
        input[type="checkbox"] { display: none; }
        
        /* Styling the label to look like a seat */
        .seat-label {
            display: inline-block;
            width: 35px; height: 35px;
            background-color: #444;
            margin: 0 5px;
            border-radius: 8px 8px 2px 2px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 35px;
            font-size: 12px;
            text-align: center;
        }
        
        /* Seat Status Colors */
        .seat-label:hover { background-color: #007bff; }
        input[type="checkbox"]:checked + .seat-label { background-color: #28a745; transform: scale(1.1); }
        
        /* The CSS class we apply if the seat is found in the database */
        .booked { background-color: #dc3545 !important; cursor: not-allowed; color: #ffcccc;}
        
        .summary-box { background: white; color: black; max-width: 400px; margin: 30px auto; padding: 20px; border-radius: 8px; text-align: left; }
        .checkout-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px;}
    </style>
</head>
<body>

    <h2>Select Your Seats</h2>
    <p th:text="${showtime.movie.title} + ' @ ' + ${showtime.theatre.name}"></p>
    
    <div class="screen"></div>
    <div class="screen-text">All eyes this way</div>

    <!-- The form will post to our upcoming payment gateway route -->
    <form th:action="@{/checkout}" method="post">
        
        <!-- Hidden input to pass the showtime ID to the payment page -->
        <input type="hidden" name="showtimeId" th:value="${showtime.id}" />

        <div class="seat-map">
            <!-- Thymeleaf loop for Rows (A to F) -->
            <div class="row" th:each="r : ${rows}">
                <div class="row-label" th:text="${r}">A</div>
                
                <!-- Thymeleaf loop for Columns (1 to 10) -->
                <th:block th:each="c : ${cols}">
                    
                    <!-- We define the seat name, e.g. "A1" -->
                    <th:block th:with="seatName=${r + c}">
                        
                        <!-- Check if this specific seatName is inside the bookedSeats list from Java -->
                        <th:block th:if="${#lists.contains(bookedSeats, seatName)}">
                            <!-- Seat is BOOKED: Render a disabled checkbox and a red label -->
                            <input type="checkbox" disabled />
                            <label class="seat-label booked">X</label>
                        </th:block>

                        <th:block th:unless="${#lists.contains(bookedSeats, seatName)}">
                            <!-- Seat is FREE: Render a clickable checkbox that submits its name -->
                            <input type="checkbox" th:id="${seatName}" name="selectedSeats" th:value="${seatName}" />
                            <label th:for="${seatName}" class="seat-label" th:text="${c}">1</label>
                        </th:block>
                        
                    </th:block>
                    
                </th:block>
            </div>
        </div>

        <div class="summary-box">
            <h3>Booking Summary</h3>
            <p><strong>Ticket Price:</strong> ₹<span th:text="${showtime.finalPrice}"></span></p>
            <p><em>(Select seats above to proceed to payment)</em></p>
            <button type="submit" class="checkout-btn">Proceed to Payment ➔</button>
        </div>
        
    </form>

</body>
</html>
